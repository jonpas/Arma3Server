[package]
name = "launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
steamdepot = { git = "https://github.com/LinkIsGrim/steamdepot", rev = "517bb3e" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
anyhow = "1"
futures = "0.3"
walkdir = "2"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
rlimit = "0.10"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
